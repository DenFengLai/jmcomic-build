  #           cp "dist/jmv" "artifacts/jmv-${{ needs.resolve.outputs.version }}-macos-x86_64"

  #       - name: Upload artifact
  #         uses: actions/upload-artifact@v4
  #         with:
  #           name: macos-x86_64
  #           path: artifacts/*
            
  publish:
    needs:
      - resolve
      - tag_release
      - build-linux-gnu
      - build-linux-musl
      - build-windows
      - build-macos-arm64
      # - build-macos-intel

    if: needs.resolve.outputs.publish == 'true'

    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-assets
          pattern: '*'
          merge-multiple: true

      - name: Show release assets
        run: |
          ls -R release-assets

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail

          TAG="${{ needs.resolve.outputs.tag }}"

          mapfile -t FILES < <(find release-assets -type f | sort)

          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release already exists"

            for file in "${FILES[@]}"; do
              gh release upload "$TAG" "$file" --clobber
            done
          else
            gh release create "$TAG" \
              "${FILES[@]}" \
              --title "$TAG" \
              --notes "Automated build for $TAG"
          fi