name: build-and-release

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "build = 只打包不发版；release = 检查/创建 tag 后发版"
        type: choice
        required: true
        default: release
        options:
          - build
          - release
      version:
        description: "可选，留空则自动读取 PyPI 最新版本"
        required: false
        default: ""
      suffix:
        description: "补丁后缀，例如 hotfix、fix.1、rebuild"
        required: false
        default: ""
      img2pdf:
        description: "发布特殊 img2pdf 版本并为 npm 添加 img2pd tag"
        type: boolean
        required: true
        default: true
      force_build:
        description: "忽略“已发版”检查，强制打包但不发版（只适合 build 模式）"
        type: boolean
        required: true
        default: false
  schedule:
    - cron: "0 2 * * *"

permissions:
  contents: write # 统一授予写权限，确保 release 检查和创建不出错

concurrency:
  group: build-and-release
  cancel-in-progress: true # 自动取消重复触发的旧任务

env:
  PACKAGE_NAME: jmcomic
  PYTHON_VERSION: "3.12"
  CORE_DIR: packages/core

jobs:
  resolve:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.meta.outputs.tag }}
      full_version: ${{ steps.meta.outputs.full_version }}
      base_version: ${{ steps.meta.outputs.base_version }}
      run_build: ${{ steps.meta.outputs.run_build }}
      run_publish: ${{ steps.meta.outputs.run_publish }}
      img2pdf: ${{ steps.meta.outputs.img2pdf }}
      npm_tag: ${{ steps.meta.outputs.npm_tag }}
    steps:
      - name: Resolve version and release state
        id: meta
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          INPUT_MODE: ${{ github.event_name == 'workflow_dispatch' && inputs.mode || 'release' }}
          INPUT_VERSION: ${{ github.event_name == 'workflow_dispatch' && inputs.version || '' }}
          INPUT_SUFFIX: ${{ github.event_name == 'workflow_dispatch' && inputs.suffix || '' }}
          INPUT_IMG2PDF: ${{ github.event_name == 'workflow_dispatch' && inputs.img2pdf || 'false' }}
          FORCE_BUILD: ${{ github.event_name == 'workflow_dispatch' && inputs.force_build || 'false' }}
        shell: bash
        run: |
          set -euo pipefail

          # 更轻量地获取版本号 (curl + jq)
          if [ -n "$INPUT_VERSION" ]; then
            VERSION="$INPUT_VERSION"
          else
            VERSION=$(curl -sL "https://pypi.org/pypi/${PACKAGE_NAME}/json" | jq -r '.info.version')
          fi

          # 拼接 Tag
          TAG="v${VERSION}"
          if [ -n "$INPUT_SUFFIX" ]; then
            TAG="${TAG}-${INPUT_SUFFIX}"
          fi
          if [ "$INPUT_IMG2PDF" = "true" ] && [[ "$TAG" != *"img2pdf" ]]; then
            TAG="${TAG}-img2pdf"
          fi

          FULL_VERSION="${TAG#v}"
          BASE_VERSION="${VERSION}"

          # 核心检查：判断 Release 是否已存在
          echo "Checking if release $TAG exists..."
          if gh release view "$TAG" --repo "${{ github.repository }}" >/dev/null 2>&1; then
            echo "✅ Release $TAG already exists."
            RELEASE_EXISTS="true"
          else
            echo "❌ Release $TAG does not exist."
            RELEASE_EXISTS="false"
          fi

          # 决策逻辑
          RUN_BUILD="false"
          RUN_PUBLISH="false"

          if [ "$INPUT_MODE" = "build" ]; then
            RUN_BUILD="true"
            echo "🎯 模式: build。将执行打包，但不发布。"
          else
            if [ "$RELEASE_EXISTS" = "true" ]; then
              if [ "$FORCE_BUILD" = "true" ]; then
                RUN_BUILD="true"
                echo "⚠️ 强制打包开启，跳过拦截执行打包，但不发布。"
              else
                echo "🛑 拦截：发行版已存在，取消所有后续构建与发布任务！"
              fi
            else
              RUN_BUILD="true"
              RUN_PUBLISH="true"
              echo "🚀 发行版不存在，准备打包并发布！"
            fi
          fi

          if [ "$INPUT_IMG2PDF" = "true" ]; then
            NPM_TAG="img2pd"
            echo "🚩 Special img2pdf npm release enabled; npm tag set to $NPM_TAG"
          else
            NPM_TAG=""
          fi

          # 写入输出
          {
            echo "tag=$TAG"
            echo "full_version=$FULL_VERSION"
            echo "base_version=$BASE_VERSION"
            echo "run_build=$RUN_BUILD"
            echo "run_publish=$RUN_PUBLISH"
            echo "img2pdf=$INPUT_IMG2PDF"
            echo "npm_tag=$NPM_TAG"
          } >> "$GITHUB_OUTPUT"

  build:
    needs: resolve
    if: needs.resolve.outputs.run_build == 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          - id: linux-gnu
            runs_on: ubuntu-latest
            artifact_suffix: linux-gnu
          - id: windows-x64
            runs_on: windows-latest
            artifact_suffix: windows-x64
          - id: macos-arm64
            runs_on: macos-latest
            artifact_suffix: macos-arm64

    runs-on: ${{ matrix.runs_on }}
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Install dependencies
        working-directory: ${{ env.CORE_DIR }}
        env:
          IMG2PDF: ${{ needs.resolve.outputs.img2pdf }}
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          if [ "$IMG2PDF" = "true" ]; then
            python -m pip install img2pdf
          fi

      - name: Build with PyInstaller
        working-directory: ${{ env.CORE_DIR }}
        run: |
          pyinstaller specs/jmcomic.spec
          if [ "$IMG2PDF" = "true" ]; then
            pyinstaller specs/jmcomic.spec --name jmcomic-img2pdf --hidden-import img2pdf
          fi
          pyinstaller specs/jmv.spec

      - name: Package artifact
        shell: bash
        env:
          VERSION: ${{ needs.resolve.outputs.base_version }}
          IMG2PDF: ${{ needs.resolve.outputs.img2pdf }}
          SUFFIX: ${{ matrix.artifact_suffix }}
        run: |
          mkdir -p artifacts
          
          # 根据不同系统自动判断扩展名
          EXT=""
          if [[ "${{ matrix.runs_on }}" == "windows-latest" ]]; then EXT=".exe"; fi
          
          # 纯 Bash 复制重命名，无需 Python
          cp "${{ env.CORE_DIR }}/dist/jmcomic${EXT}" "artifacts/jmcomic-${VERSION}-${SUFFIX}${EXT}"
          if [ "$IMG2PDF" = "true" ]; then
            cp "${{ env.CORE_DIR }}/dist/jmcomic-img2pdf${EXT}" "artifacts/jmcomic-img2pdf-${VERSION}-${SUFFIX}${EXT}"
          fi
          cp "${{ env.CORE_DIR }}/dist/jmv${EXT}" "artifacts/jmv-${VERSION}-${SUFFIX}${EXT}"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_suffix }}
          path: artifacts/*

  build-linux-musl:
    needs: resolve
    if: needs.resolve.outputs.run_build == 'true'
    runs-on: ubuntu-latest
    container: alpine:3.20
    steps:
      - uses: actions/checkout@v4

      - name: Install build tools
        run: apk add --no-cache python3 py3-pip build-base git jq curl

      - name: Install dependencies
        working-directory: ${{ env.CORE_DIR }}
        env:
          IMG2PDF: ${{ needs.resolve.outputs.img2pdf }}
        run: |
          python3 -m pip install --break-system-packages --upgrade pip
          python3 -m pip install --break-system-packages -r requirements.txt
          if [ "$IMG2PDF" = "true" ]; then
            python3 -m pip install --break-system-packages img2pdf
          fi

      - name: Build with PyInstaller
        working-directory: ${{ env.CORE_DIR }}
        env:
          IMG2PDF: ${{ needs.resolve.outputs.img2pdf }}
        run: |
          pyinstaller specs/jmcomic.spec
          if [ "$IMG2PDF" = "true" ];then
            pyinstaller entry/entry_jmcomic.py --onefile --name jmcomic-img2pdf --hidden-import img2pdf          
          fi
          pyinstaller specs/jmv.spec

      - name: Package artifact
        env:
          VERSION: ${{ needs.resolve.outputs.base_version }}
          IMG2PDF: ${{ needs.resolve.outputs.img2pdf }}
        run: |
          mkdir -p artifacts
          cp "${{ env.CORE_DIR }}/dist/jmcomic" "artifacts/jmcomic-${VERSION}-linux-musl"
          if [ "$IMG2PDF" = "true" ]; then
            cp "${{ env.CORE_DIR }}/dist/jmcomic-img2pdf" "artifacts/jmcomic-img2pdf-${VERSION}-linux-musl"
          fi
          cp "${{ env.CORE_DIR }}/dist/jmv" "artifacts/jmv-${VERSION}-linux-musl"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: linux-musl
          path: artifacts/*

  publish:
    needs: [resolve, build, build-linux-musl]
    # 严格拦截：即使前置任务成功，只要 run_publish 不为 true 绝对不执行
    if: needs.resolve.outputs.run_publish == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          TAG="${{ needs.resolve.outputs.tag }}"
          
          # 直接创建 Release。如果 Tag 不存在，gh 会自动以当前代码状态创建 Tag
          gh release create "$TAG" release-assets/* \
            --title "$TAG" \
            --notes "Automated build for $TAG" \
            --repo "${{ github.repository }}"

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          registry-url: https://registry.npmjs.org

      - name: Build and publish npm platform packages
        env:
          VERSION: ${{ needs.resolve.outputs.base_version }}
          RELEASE_ASSETS_DIR: release-assets
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          IMG2PDF: ${{ needs.resolve.outputs.img2pdf }}
          NPM_TAG: ${{ needs.resolve.outputs.npm_tag }}
        run: node scripts/package.js

      - name: Modify the version number of jmcomic
        env:
          VERSION: ${{ needs.resolve.outputs.base_version }}
        run: node scripts/inject-version.js

      - name: Publish npm of jmcomic
        working-directory: packages/jmcomic
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          NPM_TAG: ${{ needs.resolve.outputs.npm_tag }}
        run: |
          if [ -n "$NPM_TAG" ]; then
            npm publish --access public --tag "$NPM_TAG"
          else
            npm publish --access public
          fi