name: build-and-release

on:
  workflow_dispatch:
    inputs:
      mode:
        description: 'build = 只打包不发版；release = 检查/创建 tag 后发版'
        type: choice
        required: true
        default: release
        options:
          - build
          - release
      version:
        description: '可选，留空则自动读取 PyPI 最新版本'
        required: false
        default: ''
      force_build:
        description: '忽略“已发版”检查，强制打包但不发版（只适合 build 模式）'
        type: boolean
        required: true
        default: false

  schedule:
    - cron: '0 2 * * *'
      timezone: 'Asia/Tokyo'

permissions:
  contents: read

concurrency:
  group: build-and-release
  cancel-in-progress: false

env:
  PACKAGE_NAME: jmcomic
  DIST_NAME: dist
  ENTRY_SCRIPT: entry_jmcomic.py
  PYTHON_VERSION: '3.12'

jobs:
  resolve:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.meta.outputs.version }}
      tag: ${{ steps.meta.outputs.tag }}
      run_build: ${{ steps.meta.outputs.run_build }}
      publish: ${{ steps.meta.outputs.publish }}
      create_tag: ${{ steps.meta.outputs.create_tag }}
    steps:
      - name: Resolve version and release state
        id: meta
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          INPUT_MODE: ${{ github.event_name == 'workflow_dispatch' && inputs.mode || 'release' }}
          INPUT_VERSION: ${{ github.event_name == 'workflow_dispatch' && inputs.version || '' }}
          FORCE_BUILD: ${{ github.event_name == 'workflow_dispatch' && inputs.force_build || 'false' }}
        shell: bash
        run: |
          set -euo pipefail

          if [ -n "$INPUT_VERSION" ]; then
            VERSION="$INPUT_VERSION"
          else
            VERSION="$(python - <<'PY'
          import json
          import os
          import urllib.request

          pkg = os.environ["PACKAGE_NAME"]
          with urllib.request.urlopen(f"https://pypi.org/pypi/{pkg}/json") as r:
              data = json.load(r)
          print(data["info"]["version"])
          PY
          )"
          fi

          TAG="v${VERSION}"

          RELEASE_ASSET_COUNT="-1"
          if gh api "repos/${GITHUB_REPOSITORY}/releases/tags/${TAG}" --jq '.assets | length' > /tmp/release_assets.txt 2>/dev/null; then
            RELEASE_ASSET_COUNT="$(cat /tmp/release_assets.txt)"
          fi

          RUN_BUILD="false"
          PUBLISH="false"
          CREATE_TAG="false"

          if [ "$INPUT_MODE" = "build" ]; then
            RUN_BUILD="true"
            PUBLISH="false"
            CREATE_TAG="false"
          else
            if [ "$RELEASE_ASSET_COUNT" != "-1" ] && [ "$RELEASE_ASSET_COUNT" -gt 0 ] && [ "$FORCE_BUILD" != "true" ]; then
              RUN_BUILD="false"
              PUBLISH="false"
              CREATE_TAG="false"
            else
              RUN_BUILD="true"
              PUBLISH="true"
              CREATE_TAG="true"
            fi
          fi

          {
            echo "version=$VERSION"
            echo "tag=$TAG"
            echo "run_build=$RUN_BUILD"
            echo "publish=$PUBLISH"
            echo "create_tag=$CREATE_TAG"
          } >> "$GITHUB_OUTPUT"

  tag_release:
    needs: resolve
    if: needs.resolve.outputs.create_tag == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Create and push tag
        shell: bash
        run: |
          set -euo pipefail
          TAG="${{ needs.resolve.outputs.tag }}"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag -a "$TAG" -m "Release $TAG"
          git push origin "$TAG"

  build-linux-gnu:
    needs: resolve
    if: needs.resolve.outputs.run_build == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Build
        run: |
          pyinstaller jmcomic.spec

      - name: Package artifact
        run: |
          mkdir -p artifacts
          cp "dist/jmcomic" "artifacts/jmcomic-${{ needs.resolve.outputs.version }}-linux-gnu"
          cp "dist/jmv" "artifacts/jmv-${{ needs.resolve.outputs.version }}-linux-gnu"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: linux-gnu
          path: artifacts/*

  build-linux-musl:
    needs: resolve
    if: needs.resolve.outputs.run_build == 'true'
    runs-on: ubuntu-latest
    container: alpine:3.20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Install build tools
        shell: sh
        run: |
          apk add --no-cache python3 py3-pip build-base git

      - name: Install dependencies
        shell: sh
        run: |
          python3 -m pip install --break-system-packages --upgrade pip
          python3 -m pip install --break-system-packages -r requirements.txt

      - name: Build
        shell: sh
        run: |
          pyinstaller jmcomic.spec

      - name: Package artifact
        run: |
          mkdir -p artifacts

          cp "dist/jmcomic" "artifacts/jmcomic-${{ needs.resolve.outputs.version }}-linux-musl"

          cp "dist/jmv" "artifacts/jmv-${{ needs.resolve.outputs.version }}-linux-musl"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: linux-musl
          path: artifacts/*

  build-windows:
    needs: resolve
    if: needs.resolve.outputs.run_build == 'true'
    runs-on: windows-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Install dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Build
        shell: pwsh
        run: |
          pyinstaller jmcomic.spec

      - name: Package artifact
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force artifacts | Out-Null
          Copy-Item "dist/jmcomic.exe" "artifacts/jmcomic-${{ needs.resolve.outputs.version }}-windows-x86_64.exe"
          Copy-Item "dist/jmv.exe" "artifacts/jmv-${{ needs.resolve.outputs.version }}-windows-x86_64.exe"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: windows-x86_64
          path: artifacts/*

  build-macos-arm64:
    needs: resolve
    if: needs.resolve.outputs.run_build == 'true'
    runs-on: macos-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Build
        run: |
          pyinstaller jmcomic.spec

      - name: Package artifact
        run: |
          mkdir -p artifacts

          cp "dist/jmcomic" "artifacts/jmcomic-${{ needs.resolve.outputs.version }}-macos-arm64"

          cp "dist/jmv" "artifacts/jmv-${{ needs.resolve.outputs.version }}-macos-arm64"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: macos-arm64
          path: artifacts/*

