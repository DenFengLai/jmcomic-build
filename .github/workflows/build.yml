name: build-and-release

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "build = 只打包不发版；release = 检查/创建 tag 后发版"
        type: choice
        required: true
        default: release
        options:
          - build
          - release

      version:
        description: "可选，留空则自动读取 PyPI 最新版本"
        required: false
        default: ""

      suffix:
        description: "补丁后缀，例如 hotfix、fix.1、rebuild"
        required: false
        default: ""

      force_build:
        description: "忽略“已发版”检查，强制打包但不发版（只适合 build 模式）"
        type: boolean
        required: true
        default: false

  schedule:
    - cron: "0 2 * * *"

permissions:
  contents: read

concurrency:
  group: build-and-release
  cancel-in-progress: false

env:
  PACKAGE_NAME: jmcomic
  PYTHON_VERSION: "3.12"
  CORE_DIR: packages/core
  NPM_DIR: npm

jobs:
  resolve:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.meta.outputs.version }}
      tag: ${{ steps.meta.outputs.tag }}
      full_version: ${{ steps.meta.outputs.full_version }}
      run_build: ${{ steps.meta.outputs.run_build }}
      publish: ${{ steps.meta.outputs.publish }}
      create_tag: ${{ steps.meta.outputs.create_tag }}

    steps:
      - name: Resolve version and release state
        id: meta
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          INPUT_MODE: ${{ github.event_name == 'workflow_dispatch' && inputs.mode || 'release' }}
          INPUT_VERSION: ${{ github.event_name == 'workflow_dispatch' && inputs.version || '' }}
          INPUT_SUFFIX: ${{ github.event_name == 'workflow_dispatch' && inputs.suffix || '' }}
          FORCE_BUILD: ${{ github.event_name == 'workflow_dispatch' && inputs.force_build || 'false' }}
        shell: bash
        run: |
          set -euo pipefail

          if [ -n "$INPUT_VERSION" ]; then
            VERSION="$INPUT_VERSION"
          else
            VERSION="$(python - <<'PY'
          import json
          import os
          import urllib.request

          pkg = os.environ["PACKAGE_NAME"]
          with urllib.request.urlopen(f"https://pypi.org/pypi/{pkg}/json") as r:
              data = json.load(r)
          print(data["info"]["version"])
          PY
          )"
                    fi

                    if [ -n "$INPUT_SUFFIX" ]; then
                      TAG="v${VERSION}-${INPUT_SUFFIX}"
                    else
                      TAG="v${VERSION}"
                    fi

                    FULL_VERSION="${TAG#v}"

                    if gh release view "$TAG" >/dev/null 2>&1; then
                      RELEASE_EXISTS="true"
                    else
                      RELEASE_EXISTS="false"
                    fi

                    RUN_BUILD="false"
                    PUBLISH="false"
                    CREATE_TAG="false"

                    if [ "$INPUT_MODE" = "build" ]; then
                      RUN_BUILD="true"
                    else
                      if [ "$RELEASE_EXISTS" = "true" ] && [ "$FORCE_BUILD" != "true" ]; then
                        RUN_BUILD="false"
                      else
                        RUN_BUILD="true"
                        PUBLISH="true"
                        CREATE_TAG="true"
                      fi
                    fi

                    {
                      echo "version=$VERSION"
                      echo "tag=$TAG"
                      echo "full_version=$FULL_VERSION"
                      echo "run_build=$RUN_BUILD"
                      echo "publish=$PUBLISH"
                      echo "create_tag=$CREATE_TAG"
                    } >> "$GITHUB_OUTPUT"

  tag_release:
    needs: resolve
    if: needs.resolve.outputs.create_tag == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Create and push tag
        shell: bash
        run: |
          set -euo pipefail
          TAG="${{ needs.resolve.outputs.tag }}"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag -a "$TAG" -m "Release $TAG"
          git push origin "$TAG"

  build:
    needs: resolve
    if: needs.resolve.outputs.run_build == 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          - id: linux-gnu
            runs_on: ubuntu-latest
            platform: linux-gnu
            artifact_suffix: linux-gnu

          - id: windows-x86_64
            runs_on: windows-latest
            platform: windows-x86_64
            artifact_suffix: windows-x86_64

          - id: macos-arm64
            runs_on: macos-latest
            platform: macos-arm64
            artifact_suffix: macos-arm64

    runs-on: ${{ matrix.runs_on }}
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Install dependencies
        shell: bash
        working-directory: ${{ env.CORE_DIR }}
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Build
        shell: bash
        working-directory: ${{ env.CORE_DIR }}
        run: |
          pyinstaller specs/jmcomic.spec
          pyinstaller specs/jmv.spec

      - name: Package artifact
        shell: bash
        env:
          VERSION: ${{ needs.resolve.outputs.full_version }}
          SUFFIX: ${{ matrix.artifact_suffix }}
        run: |
          python - <<'PY'
          import os
          import shutil
          import sys
          from pathlib import Path

          version = os.environ["VERSION"]
          suffix = os.environ["SUFFIX"]

          core_dist = Path("packages/core/dist")
          artifacts = Path("artifacts")
          artifacts.mkdir(parents=True, exist_ok=True)

          ext = ".exe" if sys.platform.startswith("win") else ""

          for name in ("jmcomic", "jmv"):
              src = core_dist / f"{name}{ext}"
              dst = artifacts / f"{name}-{version}-{suffix}{ext}"
              shutil.copy2(src, dst)
          PY

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_suffix }}
          path: artifacts/*

  build-linux-musl:
    needs: resolve
    if: needs.resolve.outputs.run_build == 'true'
    runs-on: ubuntu-latest
    container: alpine:3.20
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v4

      - name: Install build tools
        shell: sh
        run: |
          apk add --no-cache python3 py3-pip build-base git

      - name: Install dependencies
        shell: sh
        working-directory: packages/core
        run: |
          python3 -m pip install --break-system-packages --upgrade pip
          python3 -m pip install --break-system-packages -r requirements.txt

      - name: Build
        shell: sh
        working-directory: packages/core
        run: |
          pyinstaller specs/jmcomic.spec
          pyinstaller specs/jmv.spec

      - name: Package artifact
        shell: sh
        run: |
          mkdir -p artifacts
          cp "packages/core/dist/jmcomic" "artifacts/jmcomic-${{ needs.resolve.outputs.full_version }}-linux-musl"
          cp "packages/core/dist/jmv" "artifacts/jmv-${{ needs.resolve.outputs.full_version }}-linux-musl"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: linux-musl
          path: artifacts/*

  publish:
    needs:
      - resolve
      - tag_release
      - build
      - build-linux-musl
    if: needs.resolve.outputs.publish == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-assets
          pattern: "*"
          merge-multiple: true

      - name: Show release assets
        run: |
          ls -R release-assets

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail

          TAG="${{ needs.resolve.outputs.tag }}"
          mapfile -t FILES < <(find release-assets -type f | sort)

          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release already exists"
            for file in "${FILES[@]}"; do
              gh release upload "$TAG" "$file" --clobber
            done
          else
            gh release create "$TAG" \
              "${FILES[@]}" \
              --title "$TAG" \
              --notes "Automated build for $TAG"
          fi

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          registry-url: https://registry.npmjs.org

      # - name: Install npm dependencies
      #   working-directory: packages/  npm
      #   run: npm ci

      - name: Build and publish npm platform packages
        env:
          VERSION: ${{ needs.resolve.outputs.full_version }}
          RELEASE_ASSETS_DIR: release-assets
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: node scripts/package.js

      - name: Modify the version number of jmcomic
        env:
          VERSION: ${{ needs.resolve.outputs.version }}
        run: node scripts/inject-version.js

      - name: Publish npm of jmcomic
        working-directory: packages/jmcomic
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: npm publish --access public
        